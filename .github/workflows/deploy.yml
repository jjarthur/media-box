name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        default: all
        type: choice
        options: [all, jellyfin, media, nginx-proxy-manager, pihole, stirling-pdf]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, media-box]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which services changed
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ inputs.service }}
        run: .github/scripts/ci-changed-services.sh

      - name: Deploy
        if: steps.plan.outputs.services != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOSTS: ${{ secrets.DEPLOY_HOSTS }}
        run: .github/scripts/ci-deploy.sh ${{ steps.plan.outputs.services }}
