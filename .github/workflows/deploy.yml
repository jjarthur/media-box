name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        default: all
        type: choice
        options: [all, jellyfin, media, nginx-proxy-manager, pihole, stirling-pdf]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, media-box]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOSTS: ${{ secrets.DEPLOY_HOSTS }}
        run: .github/scripts/ci-deploy.sh "${{ inputs.service || 'all' }}"
